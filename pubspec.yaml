name: klinisk_ai_assistent
description: Kliniskt beslutsstöd för svenska läkare med AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0

  # HTTP & API
  http: ^1.1.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0

  # Voice Input
  speech_to_text: ^6.5.0
  permission_handler: ^11.0.0

  # UI & Utilities
  google_fonts: ^6.1.0
  flutter_markdown: ^0.6.18
  url_launcher: ^6.2.0
  share_plus: ^7.2.0
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
